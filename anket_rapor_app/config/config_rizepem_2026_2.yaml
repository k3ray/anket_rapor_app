    heading: "2. \uFEFF\uFEFFEĞITIM PROGRAMININ; \"MESLEĞIMDE KULLANACAĞIM YENI BILGI VE/VEYA BECERILER KAZANDIRDIĞINI\" &NBSP;DÜŞÜNÜYORUM."
  - column: "\uFEFFEğitim programının; &nbsp;\"iş verimliliğime &nbsp;katkı sağlayacağını\" düşünüyorum."
