  - HARÇLAR KANUNU-SAVAŞ UZUN
  - İNSAN HAKLARI VE ADALETE ERİŞİM-VİLDAN GENÇOĞLU ALTINTAŞ
  - KALEM MEVZUATI-NAZIM ATEŞ
  - KAMUSAL YAŞAMDA PROTOKOL KURALLARI-EMRE YAMAK
  - KAYGIYLA BAŞ ETME YÖNTEMLERİ-EMEL GÜZEY
  - TEBLİGAT HUKUKU-ORHAN GÖYHAN
- id: sec4_organization
  title: IV. BÖLÜM
  type: closed_ended
  scale: quality_5
  questions:
  - "\uFEFFEğitim program sorumlusunun tutum ve yaklaşımını nasıl değerlendirirsiniz?"
  - Eğitim ortamının fiziki donanımını (ısı, ışık, havalandırma, temizlik vb) nasıl değerlendirirsiniz?
  - "\uFEFF\uFEFFEğitim ortamının teknik donanımını (bilgisayar, projeksiyon, ses sistemi, akıllı tahta vb) nasıl değerlendirirsiniz?"
  include_average_row: true
- id: sec5_venue_1
  title: V. BÖLÜM
  type: closed_ended
  scale: quality_5
  questions:
  - Resepsiyon hizmetini nasıl değerlendirirsiniz?
  - "\uFEFFOda temizlik hizmetini nasıl değerlendirirsiniz?"
  - "\uFEFFTesis personelinin tutum ve yaklaşımını nasıl değerlendirirsiniz?"
  - "\uFEFFKonakladığınız odayı donanım yönünden nasıl değerlendirirsiniz?"
  include_average_row: true
- id: sec6_venue_2
  title: VI. BÖLÜM
  type: closed_ended
  scale: quality_5
  questions:
  - "\uFEFFYemek salonu hizmetini nasıl değerlendirirsiniz?"
  - "\uFEFF\uFEFFSpor ve sosyal alanları nasıl değerlendirirsiniz?"
  - "\uFEFFOrtak kullanım alanlarının donanımı ve temizliğini nasıl değerlendirirsiniz?"
  - Eğitim programı ve verilen hizmetler hakkındaki bilgilendirmeyi nasıl değerlendirirsiniz?
  include_average_row: true
  post_questions:
  - type: single_choice
    scale: yes_no
    column: "\uFEFFEğitim Dairesi Başkanlığınca düzenlenecek farklı bir eğitim programına da katılmak ister misiniz?&nbsp;\uFEFF\
